# Global Configuration Settings
settings:
  primary_institution: "Nusenda Credit Union"  # The "us" in the "where we are uncompetitive" check
  email:
    sender: "fee-comparison-agent@domain.com"
    receiver: "recipient@domain.com"
    subject_prefix: "Daily Credit Card Fee Comparison"
  git:
    commit_history: true  # If true, auto-commits data/history.json in GHA

# Institution Scraper Mappings
institutions:
  nusenda:
    name: "Nusenda Credit Union"
    url: "https://www.nusenda.org/loans-credit-cards/credit-cards/platinum-terms-and-conditions"
    type: "html"
    # Mapping table headers/keywords to specific fields for smart fallback parsing
    field_keywords:
      annual_fee:
        - "annual fee"
      purchase_apr:
        - "apr for purchases"
        - "purchases for visa"
      balance_transfer_apr:
        - "balance transfers"
        - "apr for balance transfers"
      balance_transfer_fee:
        - "balance transfer:"
        - "balance transfer fee"
      cash_advance_apr:
        - "cash advances"
        - "apr for cash advances"
      cash_advance_fee:
        - "cash advance:"
        - "cash advance fee"
      foreign_transaction_fee:
        - "foreign transaction"
      late_payment_fee:
        - "late payment"
      returned_item_fee:
        - "returned payment"
      intro_offers:
        - "promotional apr"
        - "introductory"
        - "intro rate"
      rewards_structure:
        - "rewards"
        - "points"
        - "cashback"
        - "cash back"

  nusenda_retail_fees:
    name: "Nusenda Credit Union"
    url: "https://www.nusenda.org/news-resources/rates-fees"
    type: "lkcs_widget"
    # This page renders no fee data in its static HTML -- it loads each section
    # via a small AJAX call to a third-party widget service. client_id/endpoint_r
    # were reverse-engineered from that page's own JS (clients.lk-cs.com/shared/js/ts.min.js).
    client_id: "62155"
    endpoint_r: "277"
    widgets: [978, 979, 980, 981, 982]
    field_keywords:
      overdraft_fee:
        - "overdraft (share)"
      returned_deposit_item_fee:
        - "returned deposit item"
      returned_item_fee:
        - "overdraft paid/returned"
      stop_payment_fee:
        - "stop payment"
      dormant_account_fee:
        - "dormant account"
      account_research_fee:
        - "research for audits"
      atm_out_of_network_fee:
        - "atm use of foreign machine"
      wire_transfer_outgoing_domestic_fee:
        - "wire transfer, domestic"
      wire_transfer_outgoing_international_fee:
        - "wire transfer, international"
      cashiers_check_fee:
        - "check/bonded check (for members)"
      check_cashing_non_member_fee:
        - "check cashing for non-members"
      safe_deposit_late_payment_fee:
        - "safe deposit box late payment"
      safe_deposit_drill_fee:
        - "safe deposit box drill"
      card_replacement_fee:
        - "atm card or replacement"
      card_replacement_rush_fee:
        - "rush handling"
      monthly_maintenance_fee:
        - "minimum average balance"

  century_bank:
    name: "Century Bank (New Mexico)"
    type: "static"
    # Source: Century Bank's published account Fee Schedule (effective Dec 1, 2023),
    # a scanned/photographed PDF with no extractable text layer -- a reference copy
    # lives at assets/century_bank_fee_schedule.pdf. Values below are hand-transcribed
    # from that document; update them here if Century Bank revises its fee schedule.
    product_name: "General Account Fee Schedule"
    fees:
      overdraft_fee: "$35.00"
      returned_item_fee: "$35.00"
      returned_deposit_item_fee: "$15.00"
      stop_payment_fee: "$35.00"
      dormant_account_fee: "$10.00 per month (after 1 year of inactivity)"
      currency_exchange_fee: "$25.00"
      account_research_fee: "$25.00 per hour (1 hour minimum)"
      atm_out_of_network_fee: "$2.50"
      wire_transfer_incoming_fee: "$15.00"
      wire_transfer_outgoing_domestic_fee: "$30.00"
      wire_transfer_outgoing_international_fee: "$50.00"
      cashiers_check_fee: "$10.00"
      check_cashing_non_member_fee: "$10.00"
      safe_deposit_late_payment_fee: "$15.00"
      safe_deposit_drill_fee: "Actual cost"
      card_replacement_fee: "$12.00"
      card_replacement_rush_fee: "$75.00"
