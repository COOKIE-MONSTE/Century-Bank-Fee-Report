# Global Configuration Settings
settings:
  primary_institution: "Nusenda Credit Union"  # The "us" in the "where we are uncompetitive" check
  email:
    sender: "fee-comparison-agent@domain.com"
    receiver: "recipient@domain.com"
    subject_prefix: "Daily Credit Card Fee Comparison"
  git:
    commit_history: true  # If true, auto-commits data/history.json in GHA

# Institution Scraper Mappings
institutions:
  nusenda:
    name: "Nusenda Credit Union"
    url: "https://www.nusenda.org/loans-credit-cards/credit-cards/platinum-terms-and-conditions"
    type: "html"
    # Visa Secured's own APR addendum (Prime + 9.75%) -- overrides the
    # Consumer-range purchase_apr this scraper would otherwise broadcast to
    # every card template, including Secured, which is wrong: confirmed the
    # Secured addendum has its own distinct rate. Six addenda exist total,
    # organized by APR tier rather than card name, with no way to map the
    # three Consumer tiers to the three Consumer card names without
    # guessing -- this is the one addendum that IS unambiguous, since
    # there's exactly one Secured card and one Secured addendum.
    secured_apr_addendum_url: "https://www.nusenda.org/docs/default-source/addendums/visa-9-75-11-10-25--16-75.pdf?sfvrsn=66e73a2a_1"
    # Mapping table headers/keywords to specific fields for smart fallback parsing
    field_keywords:
      annual_fee:
        - "annual fee"
      purchase_apr:
        - "apr for purchases"
        - "purchases for visa"
      balance_transfer_apr:
        - "balance transfers"
        - "apr for balance transfers"
      balance_transfer_fee:
        - "balance transfer:"
        - "balance transfer fee"
      cash_advance_apr:
        - "cash advances"
        - "apr for cash advances"
      cash_advance_fee:
        - "cash advance:"
        - "cash advance fee"
      foreign_transaction_fee:
        - "foreign transaction"
      late_payment_fee:
        - "late payment"
      returned_item_fee:
        - "returned payment"
      intro_offers:
        - "promotional apr"
        - "introductory"
        - "intro rate"
      rewards_structure:
        - "rewards"
        - "points"
        - "cashback"
        - "cash back"

  nusenda_retail_fees:
    name: "Nusenda Credit Union"
    url: "https://www.nusenda.org/news-resources/rates-fees"
    type: "lkcs_widget"
    # This page renders no fee data in its static HTML -- it loads each section
    # via a small AJAX call to a third-party widget service. client_id/endpoint_r
    # were reverse-engineered from that page's own JS (clients.lk-cs.com/shared/js/ts.min.js).
    client_id: "62155"
    endpoint_r: "277"
    widgets: [978, 979, 980, 981, 982]
    # Product category per widget (see scraper/categories.py), keyed by the
    # same widget id used in `widgets` above -- lets comparisons only match
    # this widget's fees against other institutions' products of the same
    # tier, instead of against every product Nusenda has.
    widget_categories:
      978: "general_account_fees"   # General Fees
      979: "checking_general"       # Checking Account Fees
      980: "checking_premium"       # Dividend Checking Fee (Unlimited Checks Cleared)
      981: "checking_basic"         # Essential Checking Fee (Unlimited Checks Cleared)
      982: "money_market"           # Money Market Account Fee
    field_keywords:
      overdraft_fee:
        - "overdraft (share)"
      returned_deposit_item_fee:
        - "returned deposit item"
      returned_item_fee:
        - "overdraft paid/returned"
      stop_payment_fee:
        - "stop payment"
      dormant_account_fee:
        - "dormant account"
      account_research_fee:
        - "research for audits"
      atm_out_of_network_fee:
        - "atm use of foreign machine"
      wire_transfer_outgoing_domestic_fee:
        - "wire transfer, domestic"
      wire_transfer_outgoing_international_fee:
        - "wire transfer, international"
      cashiers_check_fee:
        - "check/bonded check (for members)"
      check_cashing_non_member_fee:
        - "check cashing for non-members"
      safe_deposit_late_payment_fee:
        - "safe deposit box late payment"
      safe_deposit_drill_fee:
        - "safe deposit box drill"
      card_replacement_fee:
        - "atm card or replacement"
      card_replacement_rush_fee:
        - "rush handling"
      monthly_maintenance_fee:
        - "minimum average balance"
    # This page publishes ONE combined wire fee per direction ("Wire
    # Transfer, Domestic" / "Wire Transfer, International") with no
    # separate incoming rate anywhere -- confirmed 2026-07-29 by checking
    # the live widget for "incoming"/"received" wording and finding none.
    # Mirrors the outgoing domestic rate into the incoming field rather
    # than leaving it "Not stated" when the source really does say the
    # same rate applies either way.
    field_aliases:
      wire_transfer_incoming_fee: wire_transfer_outgoing_domestic_fee

  century_bank:
    name: "Century Bank (New Mexico)"
    type: "static"
    # Source: Century Bank's published account Fee Schedule (effective Dec 1, 2023),
    # a scanned/photographed PDF with no extractable text layer -- a reference copy
    # lives at assets/century_bank_fee_schedule.pdf. Values below are hand-transcribed
    # from that document; update them here if Century Bank revises its fee schedule.
    #
    # This remains the ONLY source for the fees below. Confirmed 2026-07-27: there is
    # no public master fee schedule anywhere on mycenturybank.com -- the site's own
    # /rates page text says "Please refer to the Bank Fee Schedule for a detailed
    # listing of fees" but never links to one, and none of the 66 links in the site's
    # /sitemap point to a fee schedule either. Don't attempt to auto-source these; if
    # Century Bank publishes one in the future, replace this hand-transcription with
    # a real scraper against it.
    product_name: "General Account Fee Schedule"
    fees:
      overdraft_fee: "$35.00"
      returned_item_fee: "$35.00"
      returned_deposit_item_fee: "$15.00"
      stop_payment_fee: "$35.00"
      dormant_account_fee: "$10.00 per month (after 1 year of inactivity)"
      currency_exchange_fee: "$25.00"
      account_research_fee: "$25.00 per hour (1 hour minimum)"
      atm_out_of_network_fee: "$2.50"
      wire_transfer_incoming_fee: "$15.00"
      wire_transfer_outgoing_domestic_fee: "$30.00"
      wire_transfer_outgoing_international_fee: "$50.00"
      cashiers_check_fee: "$10.00"
      check_cashing_non_member_fee: "$10.00"
      safe_deposit_late_payment_fee: "$15.00"
      safe_deposit_drill_fee: "Actual cost"
      card_replacement_fee: "$12.00"
      card_replacement_rush_fee: "$75.00"

  century_bank_credit_cards:
    name: "Century Bank (New Mexico)"
    url: "https://www.tcmbank.com/cardholder-services"
    type: "tcm_issuer"
    # Century Bank's own site has zero fee data for these cards ("Cards are
    # issued by TCM Bank, N.A.", no Schumer box; the apply link goes to
    # mycommunityccard.com, an off-domain client-rendered shell with a
    # literal empty <body> -- confirmed 2026-07-27, don't attempt to
    # render it). TCM sets the fee terms, not Century -- but a Century
    # cardholder pays them, so comparison output still attributes them to
    # Century Bank; scraper/tcm_issuer_scraper.py tags each card with
    # `_issuer: "TCM Bank, N.A."` for provenance/footnoting instead of
    # dropping or hiding the attribution.
    #
    # Agreement links are resolved fresh from this crawl root every run,
    # never pinned -- confirmed the deep-linked PDF URLs rot: a URL noted
    # down was already stale within months (the crawl root now resolves
    # to a newer "..._March2026.pdf" on tcmbank.com, not the one on
    # icba.org that had been recorded).
    #
    # Annual fee and APR are set per partner bank and disclosed only on a
    # sheet at account opening -- never published anywhere. Recorded as
    # the literal string "Not publicly disclosed" (distinct from the
    # generic "Not disclosed" placeholder used elsewhere, which means
    # "field not found" -- this means "confirmed to not exist publicly"),
    # rather than left blank or guessed from another TCM partner's terms.
    products:
      "Rewards Platinum":
        agreement: "consumer"
        category: "credit_card_rewards"
      "Cash Rewards Platinum":
        agreement: "consumer"
        category: "credit_card_rewards"
      "Visa Signature Travel":
        agreement: "consumer"
        category: "credit_card_premium"
      "Visa Secured":
        agreement: "secured"
        category: "credit_card_secured"

  century_bank_checking:
    name: "Century Bank (New Mexico)"
    url: "https://www.mycenturybank.com/personal-banking/century-checking"
    type: "labeled_features"
    product_name: "Century Checking"
    category: "checking_basic"
    content_selector: "main"

  century_bank_interest_checking:
    name: "Century Bank (New Mexico)"
    url: "https://www.mycenturybank.com/personal-banking/century-interest-checking"
    type: "labeled_features"
    product_name: "Century Interest Checking"
    category: "checking_premium"
    content_selector: "main"

  century_bank_platinum_checking:
    name: "Century Bank (New Mexico)"
    url: "https://www.mycenturybank.com/personal-banking/century-platinum-checking"
    type: "labeled_features"
    product_name: "Century Platinum Checking"
    category: "checking_premium"
    content_selector: "main"

  century_bank_savings_cds_retirement:
    name: "Century Bank (New Mexico)"
    url: "https://www.mycenturybank.com/personal-banking/savings-cds-and-retirement"
    type: "multi_card_page"
    # One page holds 7 distinct products as Bootstrap `.card` divs, mixed in
    # with unrelated cards (Private Banking, Access your account, etc.) --
    # `products` is an explicit allowlist keyed by each card's <h2> text so
    # only these 7 are ingested; card boundaries are per-product, not one
    # product per URL, for this institution.
    card_selector: ".card"
    heading_selector: "h2"
    products:
      "High-Performance Savings":
        product_name: "High-Performance Savings"
        category: "savings_basic"
      "Minor Savings Account":
        product_name: "Minor Savings Account"
        category: "savings_basic"
      "High Performance MMDA":
        product_name: "High Performance MMDA"
        category: "money_market"
      "Liberty Money MarkeT":
        product_name: "Liberty Money Market"
        category: "money_market"
      "Personal Certificate of Deposit":
        product_name: "Personal Certificate of Deposit"
        category: "certificate_of_deposit"
      "Market Rate IRA":
        product_name: "Market Rate IRA"
        category: "ira"
      "Fixed Term IRA CD":
        product_name: "Fixed Term IRA CD"
        category: "ira"

  # Liberty Checking and Liberty Savings appear on the rates page with no card
  # on THIS page. Checked 2026-07-27: Liberty Checking has no page anywhere
  # (every guessed URL 404s) -- skipped, no fee data exists to scrape.
  # Liberty Savings DOES have a real page with real fee data
  # (personal-banking/liberty-savings: $10/month service fee, waived above a
  # $2,000 daily balance, $2,000 minimum opening deposit) -- but it's an
  # orphan page, not linked from the sitemap or the rates page, only found by
  # guessing the URL pattern from its sibling products' naming convention.
  # Not wired up as a scraped product in this pass; flagged for a follow-up
  # decision since an unlinked page could be retired without notice.

  secu_nm:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/fee-schedule.html"
    type: "service_fee_table"
    # The page's fee data is one 37-row SERVICE/FEE table (its other 22
    # tables are loan/CD/savings rate tables, out of scope here). Some rows
    # are visually indented sub-items of a preceding row (e.g. "Wire
    # Transfer: Domestic" followed by an indented "International" row) --
    # scraper/service_fee_table_scraper.py reconstructs those into
    # "Wire Transfer: International" automatically.
    product_name: "SECU NM Fee Schedule"
    category: "general_account_fees"
    table_header_hints: ["service", "fee"]
    # Confirmed 2026-07-27: this page states "Effective 01/23/23", but SECU
    # NM's Truth-in-Savings PDF (page 7's fee schedule section) has
    # identical fee values under a DIFFERENT stated date, 07/14/2023. The
    # scraper surfaces this as a warning every run rather than silently
    # trusting either date -- see service_fee_table_scraper.py.
    effective_date_pattern: 'Effective\s+(\d{1,2}/\d{1,2}/\d{2,4})'
    known_conflicting_dates:
      "the Truth-in-Savings PDF's fee schedule (page 7)": "07/14/2023"
    field_keywords:
      card_replacement_fee:
        - "atm/debit card re-issue"
      wire_transfer_outgoing_domestic_fee:
        - "wire transfer: domestic"
      wire_transfer_outgoing_international_fee:
        - "wire transfer: international"
      # Confirmed with the requester: SECU NM lists "NSF - Nonsufficient
      # Funds Fee" and "Overdraft Privilege NSF Fee" as separate rows
      # (both $25.00) -- both are treated as sources for overdraft_fee.
      # Matched on "nsf"/"nonsufficient funds"/"overdraft privilege" rather
      # than a longer phrase because the page's dash character between
      # "NSF" and "Nonsufficient Funds Fee" doesn't decode cleanly.
      overdraft_fee:
        - "nsf"
        - "nonsufficient funds"
        - "overdraft privilege"
      foreign_transaction_fee:
        - "international atm/debit card transactions"
      atm_out_of_network_fee:
        - "foreign atm fee"
      # Fees below weren't in the requester's known-mapping list but are
      # confident matches to our existing categories (near-exact phrasing
      # or an already-listed synonym in scraper/fee_taxonomy.py).
      account_research_fee:
        - "account reconciliation or research"
      cashiers_check_fee:
        - "cashier's/official check fee"
      dormant_account_fee:
        - "dormant account fee"
      returned_item_fee:
        - "return check charge"
      stop_payment_fee:
        - "stop payment fee"
      # Rows with no plausible existing category (early account closure,
      # collection items, check/statement copies, counter checks, CD/club
      # early withdrawal penalties, escheatment, excess withdrawal count,
      # garnishment, gift cards, returned mail, loan-pay-by-phone, shared
      # branching, uncollected funds) are deliberately left unmapped here
      # -- the scraper reports them as unmatched (see its warnings/
      # data/history.json) instead of forcing them into an existing field.
    # This page publishes ONE combined wire fee per direction ("Wire
    # Transfer: Domestic" / "International") with no separate incoming
    # rate anywhere -- confirmed 2026-07-29 by checking the live page for
    # "incoming"/"received"/"inbound" wording and finding none. Mirrors
    # the outgoing domestic rate into the incoming field rather than
    # leaving it "Not stated" when the source really does say the same
    # rate applies either way.
    field_aliases:
      wire_transfer_incoming_fee: wire_transfer_outgoing_domestic_fee

  secu_nm_credit_cards:
    name: "State Employees Credit Union of New Mexico"
    url: "https://cdn.firstbranchcms.com/kcms-doc/29/68439/Credit-Card-Disclosure.pdf"
    type: "shared_credit_card_disclosure"
    # Corrected from the original 2-card list: there are 3 SECU NM Visa cards
    # (Platinum 7.50%, Gold 9.25%, Classic 12.50% -- confirmed 2026-07-27 on
    # the live rates table; fee-schedule.html's embedded credit-card table
    # only shows 2, missing Classic). All three share ONE PDF disclosure for
    # annual fee, cash advance, balance transfer, foreign transaction, and
    # late payment fee -- there is no separate Schumer box per card, so
    # those fields are recorded as asserted-universal (see
    # scraper/shared_credit_card_scraper.py), while purchase_apr comes from
    # the live rates table per-card. The PDF states it's "current as of
    # September 30, 2021"; the scraper flags this as stale automatically.
    # Category is credit_card_standard for all three: nothing in either
    # source distinguishes them by feature set (secured/rewards/etc.), only
    # by APR tier -- flag if a finer category split is wanted later.
    rates_url: "https://www.secunm.org/loans/loans/credit-card.html"
    products:
      "Visa Platinum":
        category: "credit_card_standard"
      "Visa Gold":
        category: "credit_card_standard"
      "Visa Classic":
        category: "credit_card_standard"

  # Checking is 4 products, corrected from "3 Kasasa options" -- Regular
  # Checking is real (confirmed 2026-07-27: accounts/checking/regular-
  # checking.html, 200) but isn't featured on the rewards-focused compare
  # page, only reachable via the main checking landing page's link list.
  # "Money Manager" (a rate-table-only tiered savings/MM product) is
  # correctly NOT included here -- it has no checking-account features and
  # no product page of its own.
  #
  # Each of these asserts "no maintenance fee" as a blanket statement
  # rather than a per-product line item -- e.g. the three Kasasa PDFs all
  # say "There are no maintenance or activity fees/charges associated with
  # this account... [except] a dormant account fee". That's real evidence,
  # but weaker than an independent per-product confirmation, so it's
  # recorded via assert_universal_fee (see scraper/asserted_fee_scraper.py)
  # and shows in the report as "asserted universal", not
  # "verified across all products".
  secu_nm_kasasa_cash:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/_/kcms-doc/29/45754/Kasasa_Cash_and_Reward_Checking_Disclosure.pdf"
    type: "asserted_fee"
    source_format: "pdf"
    product_name: "Kasasa Cash"
    category: "checking_premium"
    assertions:
      - field: "monthly_maintenance_fee"
        pattern: "There are no maintenance or activity (?:fees|charges) associated with this account[^.]*\\."
        value: "None"

  secu_nm_kasasa_cash_back:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/_/kcms-doc/29/45759/Kasasa-Cash-Back-Disclosure.pdf"
    type: "asserted_fee"
    source_format: "pdf"
    product_name: "Kasasa Cash Back"
    category: "checking_premium"
    assertions:
      - field: "monthly_maintenance_fee"
        pattern: "There are no maintenance or activity (?:fees|charges) associated with this account[^.]*\\."
        value: "None"

  secu_nm_kasasa_tunes:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/_/kcms-doc/29/45767/Kasasa-Tunes-and-Perks-Plus-Checking-Disclosure.pdf"
    type: "asserted_fee"
    source_format: "pdf"
    product_name: "Kasasa Tunes"
    category: "checking_premium"
    assertions:
      - field: "monthly_maintenance_fee"
        pattern: "There are no maintenance or activity (?:fees|charges) associated with this account[^.]*\\."
        value: "None"

  secu_nm_regular_checking:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/accounts/checking/regular-checking.html"
    type: "asserted_fee"
    source_format: "html"
    content_selector: "main"
    product_name: "Regular Checking"
    category: "checking_basic"
    assertions:
      - field: "monthly_maintenance_fee"
        # Negative lookahead guards against a conditional phrasing like
        # "no monthly service fee with a minimum daily balance of $X" being
        # misread as unconditional -- see Century Bank's checking scraper,
        # which hit exactly this bug against real page text.
        pattern: "no monthly service fee(?!\\s+with)"
        value: "None"

  secu_nm_tis_savings:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/_/kcms-doc/29/8947/Truth-in-Savings-Disclosure.pdf"
    type: "tis_table"
    # Positional (pdfplumber) extraction of the "Minimum Balance to Avoid a
    # Service Fee" column -- see scraper/tis_table_scraper.py for why this
    # source needs ruling-line-based extraction, not text extraction, and
    # why every field from it is forced to low confidence regardless of
    # how clean it looks.
    #
    # Scoped to only the savings-tier rows below. Deliberately NOT
    # including: Kasasa Cash/Cash Back/Regular Checking/IRA (already
    # covered by their own cleaner PDF/page sources above and below -- this
    # table shows "None" for all of them too, so it would only be redundant
    # corroboration, not new data; the IRA product page confirmed 2026-07-29
    # states the same "no monthly/annual maintenance fees" more directly,
    # see secu_nm_ira below); "Money Market Account*"/"Advantage+ Money
    # Market Account***" (their balance-tier sub-rows show literal "$N/A"
    # placeholder artifacts in this table, and neither name is an exact
    # match for the "Money Manager" product this task named -- flagging
    # that naming ambiguity rather than guessing which, if either, row it
    # refers to).
    table_page: 1
    min_balance_column_index: 7
    products:
      "Share Savings**":
        product_name: "Share Savings"
        category: "savings_basic"
      "Christmas Club Savings":
        product_name: "Christmas Club Savings"
        category: "savings_basic"
      "Vacation Club Savings":
        product_name: "Vacation Club Savings"
        category: "savings_basic"
      "Special Savings":
        product_name: "Special Savings"
        category: "savings_basic"
      "UTMA/UGMA Savings":
        product_name: "UTMA/UGMA Savings"
        category: "savings_basic"

  secu_nm_ira:
    name: "State Employees Credit Union of New Mexico"
    url: "https://www.secunm.org/accounts/savings/individual-retirement-accounts-iras.html"
    type: "asserted_fee"
    source_format: "html"
    content_selector: "main"
    product_name: "IRA (Traditional/Roth)"
    category: "ira"
    # Replaces the low-confidence Truth-in-Savings-PDF extraction that
    # used to cover this product (see secu_nm_tis_savings above) -- this
    # dedicated product page states the same fact directly and
    # unconditionally, covering both the Traditional and Roth options
    # described on the page (one written claim, not per-product).
    assertions:
      - field: "monthly_maintenance_fee"
        pattern: "No monthly or annual maintenance fees"
        value: "None"

  # First National 1870 is a trade-name division of Sunflower Bank, N.A.
  # (Member FDIC, NMLS #709491) -- it has no separate charter and files no
  # separate call report, so "name" is set to make that explicit everywhere
  # it appears in the report rather than implying it's its own bank.
  #
  # firstnational1870.com blocks programmatic requests with a Cloudflare
  # Managed Challenge on every /personal/* and /terms-and-agreements/* page
  # (confirmed 2026-07-29: both a plain `requests` fetch with a real
  # browser User-Agent, and a separate headless fetch tool, got a 403
  # "Managed Challenge" page -- not a one-off, a GitHub Actions runner
  # would hit the identical block every run). sunflowerbank.com serves
  # character-identical documents from the same CMS/asset GUIDs (confirmed
  # by diffing both hosts' Pinnacle/Elevation TISA PDFs and the credit
  # card TILA table) and is NOT behind that challenge, so every HTML
  # source below uses that host instead. This is a hosting/bot-protection
  # difference only, not a regional pricing difference -- see the next
  # paragraph.
  #
  # Fees do NOT vary by region: firstnational1870.com (the New Mexico
  # brand) and sunflowerbank.com (the KS/CO/TX/AZ brand) run off one CMS
  # and serve the same fee schedule bank-wide. The only place either
  # brand's pages say "may vary by location" is a CD-rate footnote --
  # that's about interest rates/APYs, never fees, and doesn't apply here.
  # The Account Agreement is governed by Colorado law even for NM
  # customers, for the same reason.
  #
  # There is no general Fee Schedule published on either host -- every
  # Truth-in-Savings disclosure instead says one is "provided to you at
  # the time you open an account... and upon request." Confirmed absent
  # 2026-07-29 (checked both hosts and the /terms-and-agreements hub).
  # That's a real comparison finding, not just a scraping gap -- see
  # fn1870_not_disclosed below, which represents it explicitly rather than
  # leaving the 14 affected fields looking merely unscraped.
  fn1870_credit_cards:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    url: "https://www.sunflowerbank.com/personal/loans-credit/credit-cards/consumer-credit-cards"
    type: "schumer_box"
    # One TILA/Schumer-box table covers Classic, Gold and Platinum Visa
    # Rewards identically -- structurally the same situation as Century
    # Bank's TCM agreement covering multiple cards, so this feeds
    # credit_card_matrix.py rather than a per-tier comparison. Cards are
    # issued by Sunflower Bank, N.A. directly under its own Visa license --
    # no TCM, no third-party issuer, so no issuer footnote applies here.
    #
    # This page publishes NO effective date anywhere (confirmed 2026-07-29
    # -- searched for "as of"/"effective"/date-pattern text, found none).
    # It's the only institution in this report whose card source doesn't
    # state one; drift.py is the sole signal that terms changed.
    #
    # Purchase APR and Balance Transfer APR share ONE table row/value --
    # both fields are assigned from it, but they are not two independent
    # confirmations of the same number.
    field_keywords:
      annual_fee:
        - "annual fees"
      purchase_apr:
        - "annual percentage rate (apr) for purchases and balance transfers"
      balance_transfer_apr:
        - "annual percentage rate (apr) for purchases and balance transfers"
      cash_advance_apr:
        - "apr for cash advances"
      balance_transfer_fee:
        - "balance transfer"
      cash_advance_fee:
        - "cash advances"
      foreign_transaction_fee:
        - "foreign transaction"
      late_payment_fee:
        - "late payment"
      returned_item_fee:
        - "returned payment"
    range_fields: ["purchase_apr", "balance_transfer_apr"]
    first_percentage_fields: ["cash_advance_apr"]
    # Matrix-only fields (not part of the canonical per-product field set --
    # see credit_card_matrix.py's MATRIX_ROWS) that ride along on
    # `_matrix_extra` the same way TcmIssuerScraper's do.
    matrix_extra_keywords:
      min_finance_charge:
        - "minimum interest charge"
      grace_period:
        - "how to avoid paying interest on purchases"
      expedited_payment:
        - "expedited delivery fee"
    products:
      "Classic":
        product_name: "Visa Classic"
        category: "credit_card_standard"
      "Gold":
        product_name: "Visa Gold"
        category: "credit_card_rewards"
      "Platinum":
        product_name: "Visa Platinum Rewards"
        category: "credit_card_rewards"

  fn1870_checking:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    url: "https://www.sunflowerbank.com/personal/checking-accounts"
    type: "comparison_table"
    # "Minimum Balance Required to Open" and "Paper Statement" have no
    # existing canonical field (paper statement fee here is a DEPOSIT
    # account fee, unrelated to any credit-card field of a similar name) --
    # reported as informational facts per product rather than forced into
