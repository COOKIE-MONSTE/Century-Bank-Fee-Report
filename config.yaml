      - "paper statement"
    products:
      "Pinnacle Checking":
        category: "checking_premium"
      "Elevation Checking":
        category: "checking_general"
      "Foundation Checking":
        category: "checking_general"
      "SunNet\xae Checking":
        category: "checking_basic"
      "Achievement Checking":
        category: "checking_basic"

  fn1870_savings:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    url: "https://www.sunflowerbank.com/personal/savings-accounts"
    type: "comparison_table"
    # Savings maintenance fees are QUARTERLY ($5/qtr) while the money
    # market is MONTHLY ($8/mo) -- the page's own "Account Maintenance Fee"
    # row already states the fee as a full sentence including the period
    # ("...per quarterly statement cycle..." / "...per monthly statement
    # cycle..."), so unlike fn1870_checking this needs no value template:
    # taking that row verbatim already preserves the distinction the
    # mechanism-mismatch check needs.
    field_keywords:
      monthly_maintenance_fee:
        - "account maintenance fee"
    informational_keywords:
      - "minimum balance required to open"
      - "activity fee per item"
    products:
      "SunNet\xae Savings":
        category: "savings_basic"
      "Essential Savings":
        category: "savings_basic"
      "Supreme Money Market":
        category: "money_market"

  fn1870_overdraft:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    url: "https://www.sunflowerbank.com/terms-and-agreements/understanding-overdraft-privilege"
    type: "regex_value"
    product_name: "First National 1870 -- Overdraft Privilege"
    category: "general_account_fees"
    # The only public source for the overdraft/NSF amount. The page states
    # both the consumer AND business fee in one sentence -- "a fee
    # (currently $29.00 for consumer accounts and $36.00 for business
    # accounts)" -- so the pattern is anchored on the literal phrase "for
    # consumer accounts" immediately after the dollar amount, which the
    # business figure can never satisfy.
    field_patterns:
      overdraft_fee: '(\$[\d,]+(?:\.\d{2})?)\s+for consumer accounts'

  fn1870_not_disclosed:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    type: "static"
    product_name: "First National 1870 -- Fee Schedule Not Publicly Available"
    category: "general_account_fees"
    # Every Truth-in-Savings disclosure on both firstnational1870.com and
    # sunflowerbank.com states the general Fee Schedule is "provided to you
    # at the time you open an account... and upon request" rather than
    # published online -- confirmed absent 2026-07-27 by searching both
    # hosts and the /terms-and-agreements hub. Every value below uses the
    # NOT_PUBLICLY_DISCLOSED sentinel (matching tcm_issuer_scraper.py's
    # constant of the same name) rather than the generic "Not disclosed"
    # placeholder: that distinction -- "confirmed to not exist publicly"
    # vs. "field not found" -- is exactly right here, and this is the
    # first institution where it applies at this scale. Closing this gap
    # requires phoning 888.827.5564 or visiting a branch to request the
    # Fee Schedule, then transcribing it here with the retrieval date
    # recorded, the same way Century Bank's hand-transcribed schedule is
    # handled.
    warning: >
      First National 1870 does not publish a general Fee Schedule online.
      Its Truth-in-Savings disclosures state the schedule is "provided to
      you at the time you open an account... and upon request." 14 fee
      types in this report cannot be sourced publicly for this
      institution. Verified 2026-07-29.
    fees:
      stop_payment_fee: "Not publicly disclosed"
      returned_deposit_item_fee: "Not publicly disclosed"
      wire_transfer_incoming_fee: "Not publicly disclosed"
      wire_transfer_outgoing_domestic_fee: "Not publicly disclosed"
      wire_transfer_outgoing_international_fee: "Not publicly disclosed"
      cashiers_check_fee: "Not publicly disclosed"
      check_cashing_non_member_fee: "Not publicly disclosed"
      atm_out_of_network_fee: "Not publicly disclosed"
      account_research_fee: "Not publicly disclosed"
      currency_exchange_fee: "Not publicly disclosed"
      safe_deposit_late_payment_fee: "Not publicly disclosed"
      safe_deposit_drill_fee: "Not publicly disclosed"
      card_replacement_fee: "Not publicly disclosed"
      card_replacement_rush_fee: "Not publicly disclosed"

  fn1870_hsa:
    name: "First National 1870 (Sunflower Bank, N.A.)"
    url: "https://www.sunflowerbank.com/getContentAsset/48905178-4983-4804-bfbe-70bc503883a5/50c2bc4c-a8ff-46ba-95c2-0e74752d147f/Checking-540-Health-Savings-Account-Example-Account-Disclosure-FINAL-03-27-26.pdf?language=en-US"
    type: "regex_value"
    product_name: "Health Savings Account"
    category: "checking_general"
    # Truth-in-Savings "Example Account Disclosure" for the HSA product
    # (internal doc code "Checking 540" / "DD8106") -- confirmed live and
    # text-extractable directly via pypdf 2026-08-04 (no scanned-image
    # issue, unlike the Foundation Checking disclosure on this same CMS --
    # see the comment on fn1870_checking's "Foundation Checking" product
    # for that one; its numbers are already covered live by that scraper,
    # so it needed no new entry here). The account is structurally a
    # checking account with NOW + money market sub-accounts (the
    # disclosure's own wording), hence checking_general rather than a new
    # HSA-specific category -- no other institution in this report offers
    # a comparable HSA product.
    #
    # Like every other FN1870 Truth-in-Savings disclosure, this one ALSO
    # says fees are "provided to you at the time you open an account...
    # and upon request" -- i.e. this is still not the general Fee
    # Schedule PDF (see fn1870_not_disclosed, still unresolved). Only the
    # 2 fees this document states about ITSELF, in its own "ACCOUNT
    # SPECIFIC FEE SCHEDULE" section, are captured below. The document
    # also states "unlimited withdrawals ... with no activity fee" --
    # deliberately not captured as a field: it has no established
    # canonical name anywhere in this report and no dollar figure to
    # extract, matching how Foundation Checking's own activity-fee
    # statement is likewise left uncaptured.
    field_patterns:
      monthly_maintenance_fee: 'ACCOUNT MAINTENANCE FEE:\s*This account has (no monthly maintenance fee)'
      hsa_transfer_fee: 'TRANSFER FEE:\s*A fee of\s*(\$[\d,]+(?:\.\d{2})?)\s+will be charged to transfer your HSA'
    field_fixed_values:
      monthly_maintenance_fee: "None"

  # Enterprise Bank & Trust (New Mexico) -- Enterprise Financial Services
  # Corp, Clayton MO, routing #081006162, on www.enterprisebank.com ONLY.
  #
  # At least three unrelated banks also trade as some variant of
  # "Enterprise Bank": enterprisebankpgh.com (Enterprise Bank, Pittsburgh
  # PA -- has its own "Schedule of Fees" and "Simplicity Consumer
  # Checking" that are easy to confuse with this institution's, and are
  # MORE RECENT, making them tempting if anyone re-researches this by
  # hand), ebsc.bank / enterprise.bank (Enterprise Bank, SC/other), and
  # enterprisebanking.com (Enterprise Bank & Trust Co., Lowell MA). Every
  # URL below must be on www.enterprisebank.com -- if a future edit adds a
  # URL on any other host for this institution, that's the single easiest
  # way to poison this dataset.
  #
  # Unlike First National 1870, Enterprise genuinely regionalizes pricing.
  # Confirmed 2026-07-29: Interest Checking is $5/mo below $500 for the NM
  # ZIP group vs. $12/mo below $1,500 non-NM (/personal/wc-interest-checking).
  # Every checking/savings URL below is deliberately the NM-slugged
  # individual product page (nm-primary-benefits-checking-account,
  # extra-benefits-checking-account-eba, maximum-benefits-checking-account-mba,
  # interest-checking-nm, savings-nm) rather than the shared /personal/checking
  # aggregator page -- that page mixes FOUR regions' product blocks in its
  # raw HTML with no server-side ZIP selection, so parsing it risks
  # silently reporting a different region's pricing as New Mexico's. Each
  # NM product already has its own dedicated, unambiguous URL, so there's
  # no need to parse the ambiguous aggregator at all.
  enterprise_bank_fee_schedule:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/scheduleoffees"
    type: "line_item_fee"
    category: "general_account_fees"
    product_name: "Enterprise Bank & Trust -- Schedule of Fees"
    # /scheduleoffees 302s to sites/default/files/2019-05/2019-05-15.pdf.
    # Do NOT replace this with either linked-from-the-site URL --
    # https://wvw.enterprisebank.com/schedule-of-fees(-consumer) is a
    # typo'd hostname ("wvw", not "www") and is dead, and correcting the
    # typo doesn't help either: www.enterprisebank.com/schedule-of-fees-consumer
    # returns an empty body. This redirect endpoint is the only working path.
    # Confirmed ?l=nm / ?l=st / ?l=consumer all serve the byte-identical
    # file -- the l= parameter is vestigial, this is one bank-wide schedule.
    #
    # Also do not source anything from sites/default/files/2019-02/Fee%20Schedule.pdf
    # (an earlier, superseded revision that still resolves) -- it disagrees
    # with the current 2019-05-15 file on several lines (e.g. it still
    # lists a $4.00 paper statement fee that no longer exists).
    #
    # Combined consumer + commercial document -- business-only lines
    # (Money Service Business fee, Fed Cash Handling, Advanced Credit Cash
    # Handling, bulk coin/currency, night deposit bag, uncollected funds,
    # garnishments, collection items, every EBDIRECT-originated variant)
    # are deliberately NOT in field_keywords/combined_fields below, so
    # they're never looked up and can't leak into consumer comparisons.
    field_keywords:
      overdraft_fee:
        - "Overdrafts Paid"
      returned_item_fee:
        - "NSF's Returned"
      returned_deposit_item_fee:
        - "Deposited Items Returned Unpaid"
      stop_payment_fee:
        - "Stop Payments"
      wire_transfer_outgoing_domestic_fee:
        - "Domestic Wire Transfers (Outgoing)"
      wire_transfer_outgoing_international_fee:
        - "Foreign Wire Transfers (Outgoing)"
      cashiers_check_fee:
        - "Cashier's Check"
      account_research_fee:
        - "Account Research/Assistance"
      card_replacement_fee:
        - "ATM/Debit Card Replacement"
      card_replacement_rush_fee:
        - "Special Handling for Debit Cards"
      dormant_account_fee:
        - "Dormant Fee"
      safe_deposit_drill_fee:
        - "Safe Deposit Box Drilling & Key Replacement"
    # Fields with no matching split in this document's own field list --
    # combined here into one string rather than picking just one number
    # and silently dropping the other.
    combined_fields:
      wire_transfer_incoming_fee:
        parts:
          - label: "Domestic Wire Transfers (Incoming)"
            prefix: "Domestic: "
          - label: "Foreign Wire Transfers (Incoming)"
            prefix: "Foreign: "
        join: " / "
      check_cashing_non_member_fee:
        parts:
          - label: "Check Cashing (ck<500) Non Customer"
            prefix: "Under $500: "
          - label: "Check Cashing (ck>500) Non Customer"
            prefix: "Over $500: "
        join: "; "
    # "Safe Deposit Box Drilling & Key Replacement" literally reads "Fees
    # vary by location" -- that IS disclosed (the document states it in so
    # many words), just not as a single centrally-set figure, so as of
    # 2026-08-04 this is taken as the literal phrase rather than the
    # NOT_PUBLICLY_DISCLOSED sentinel (that sentinel means "confirmed to
    # not exist publicly", which doesn't fit a value the source states
    # outright). classify_mechanism() in attribution.py recognizes "vary
    # by location" and resolves it to the "variable" mechanism, same
    # bucket as the "actual cost"/"at cost" phrasing used elsewhere.

  enterprise_bank_not_disclosed:
    name: "Enterprise Bank & Trust (New Mexico)"
    type: "static"
    product_name: "Enterprise Bank & Trust -- Not Publicly Disclosed"
    category: "general_account_fees"
    # Card-level cash advance/balance transfer/foreign transaction/late
    # payment/returned payment fees are handled on the credit card entry
    # below (fixed_not_disclosed_fields) since those are genuinely
    # card-specific concepts here, not general account fees. These three
    # are the remaining FIELD_LABELS keys with no source anywhere:
    # Allpoint network access is free but the OUT-of-network ATM amount
    # isn't published, and neither is a currency exchange fee or a safe
    # deposit box LATE PAYMENT fee (distinct from the drilling fee above,
    # which at least gets a "varies by location" acknowledgment).
    fees:
      atm_out_of_network_fee: "Not publicly disclosed"
      currency_exchange_fee: "Not publicly disclosed"
      safe_deposit_late_payment_fee: "Not publicly disclosed"

  enterprise_bank_nm_primary_checking:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/nm-primary-benefits-checking-account"
    type: "regex_value"
    product_name: "Primary Benefits Account"
    category: "checking_basic"
    field_patterns:
      monthly_maintenance_fee: '(No monthly fee)'
    # Detector-only pattern (see regex_value_scraper.py) -- once matched,
    # record the canonical "None" rather than the raw feature-list phrase,
    # so classify_mechanism() recognizes it as a confirmed no-fee value.
    field_fixed_values:
      monthly_maintenance_fee: "None"

  enterprise_bank_nm_eba_checking:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/extra-benefits-checking-account-eba"
    type: "regex_value"
    product_name: "Extra Benefits Account (EBA)"
    category: "checking_general"
    # Dual-condition waiver ("OR" between two different balance types) --
    # the full sentence is captured rather than reduced to "$15.00", or
    # the comparison against other institutions' single-condition waivers
    # would be misleading.
    field_patterns:
      monthly_maintenance_fee: '(If your average daily balance falls below \$[\d,]+ or your relationship balance is less than \$[\d,]+, a monthly service charge of \$[\d.]+ applies\.)'

  enterprise_bank_nm_mba_checking:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/maximum-benefits-checking-account-mba"
    type: "regex_value"
    product_name: "Maximum Benefits Account (MBA)"
    category: "checking_premium"
    field_patterns:
      monthly_maintenance_fee: '(If your average daily balance falls below \$[\d,]+ or your relationship balance is less than \$[\d,]+, a monthly service charge of \$[\d.]+ applies\.)'
    # "No fees for cashier's checks and money orders" is a written
    # catch-all statement specific to THIS product, overriding what the
    # general Schedule of Fees charges ($5.00) -- recorded via
    # assert_universal_fee (asserted, not an ordinary line item) rather
    # than plain assignment.
    asserted_field_patterns:
      cashiers_check_fee: "(No fees for cashier.s checks and money orders)"
    field_fixed_values:
      cashiers_check_fee: "None"

  enterprise_bank_nm_interest_checking:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/interest-checking-nm"
    type: "regex_value"
    product_name: "Interest Checking"
    # checking_premium, not checking_general -- this is an interest-
    # bearing account, the same tier Century Interest Checking occupies
    # ($5/mo waived with $500 minimum daily balance, an exact fee-for-fee
    # match). Reclassified 2026-07-30; was previously landing in the
    # tier-unspecified fallback bucket instead of next to its real peer.
    category: "checking_premium"
    # Genuinely NM-specific pricing: $5/mo below $500. The non-NM
    # equivalent (/personal/wc-interest-checking, not scraped here) is
    # $12/mo below $1,500 -- confirmed 2026-07-29, do not swap these.
    field_patterns:
      monthly_maintenance_fee: '(You must maintain a minimum balance[^.]*\.)'

  enterprise_bank_liberty_checking:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/liberty-checking"
    type: "regex_value"
    product_name: "Liberty Checking"
    category: "checking_general"
    # For clients 50+ or active/retired military/first responders. States
    # "No monthly fee" directly on the page -- confirmed 2026-07-29.
    field_patterns:
      monthly_maintenance_fee: '(No monthly fee)'
    field_fixed_values:
      monthly_maintenance_fee: "None"

  enterprise_bank_nm_savings:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/savings-nm"
    type: "regex_value"
    product_name: "Personal Savings"
    category: "savings_basic"
    # No CD page with published figures exists for the NM ZIP group --
    # not invented here.
    field_patterns:
      monthly_maintenance_fee: '(No monthly fees)'
    field_fixed_values:
      monthly_maintenance_fee: "None"

  enterprise_bank_money_market:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/money-market"
    type: "regex_value"
    product_name: "Personal Money Market"
    category: "money_market"
    # Adds Enterprise to the Money Market Account comparison, currently
    # missing it entirely -- confirmed 2026-07-30. Unlike the NM-specific
    # checking/interest-checking/savings pages (URL suffix "-nm"), this
    # page has no ZIP-gating markup at all (checked for
    # "zip"/"zipgroup"/"region" wording, found none) -- appears to be one
    # bank-wide product, not a region-gated aggregator like
    # /personal/checking.
    field_patterns:
      monthly_maintenance_fee: '(If your average daily balance falls below \$[\d,]+, a monthly service charge of \$[\d.]+ applies\.)'

  enterprise_bank_credit_cards:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/credit-cards"
    type: "product_column_table"
    # Unlike Century Bank / SECU NM / First National 1870 (one shared
    # disclosure per institution), Enterprise genuinely differentiates per
    # card: three distinct annual fees ($0/$0/$50) and two distinct APR
    # bands. This is a real per-product comparison, so it feeds the
    # attribution pipeline with three separate cards instead of only the
    # institution-level matrix.
    #
    # Page footnote: "Rate Information is accurate as of 06/27/2022" --
    # self-declared, 4 years old as of this writing. staleness_pattern
    # below warns about this the same way SECU NM's card disclosure does.
    staleness_pattern: 'accurate as of\s+(\d{1,2}/\d{1,2}/\d{4})'
    field_keywords:
      annual_fee:
        - "Annual Fees"
      purchase_apr:
        - "Annual Percentage Rate (APR) for Purchases and Balance Transfers"
      balance_transfer_apr:
        - "Annual Percentage Rate (APR) for Purchases and Balance Transfers"
      intro_offers:
        - "Annual Percentage Rate (APR) for Purchases and Balance Transfers"
      cash_advance_apr:
        - "APR for Cash Advances"
      rewards_structure:
        - "Rewards"
    # One row's cell holds an intro-APR sentence AND the standing APR
    # range together -- each field below pulls just its own portion out of
    # that same raw cell text instead of the whole paragraph.
    field_extract_patterns:
      purchase_apr: 'After that, APR will be ([\d.]+%\s*-\s*[\d.]+%)'
      balance_transfer_apr: 'After that, APR will be ([\d.]+%\s*-\s*[\d.]+%)'
      intro_offers: '(0\.00% introductory APR[^.]*\.)'
      cash_advance_apr: '^([\d.]+%)'
    # Not published anywhere for these cards -- re-checked 2026-08-04, not
    # on this page and Enterprise publishes no consumer cardholder
    # agreement. foreign_transaction_fee is deliberately NOT in this list
    # (see enterprise_bank_foreign_transaction below): it's disclosed on a
    # different Enterprise page, just not this one.
    fixed_not_disclosed_fields:
      - "cash_advance_fee"
      - "balance_transfer_fee"
      - "late_payment_fee"
      - "returned_item_fee"
    products:
      "Visa Non-Rewards Card":
        product_name: "Visa Non-Rewards"
        category: "credit_card_standard"
      "Visa Rewards Card":
        product_name: "Visa Rewards"
        category: "credit_card_rewards"
      "Visa Rewards Plus Card":
        product_name: "Visa Rewards Plus"
        category: "credit_card_rewards"

  enterprise_bank_foreign_transaction:
    name: "Enterprise Bank & Trust (New Mexico)"
    url: "https://www.enterprisebank.com/personal/travel-tips"
    type: "regex_value"
    product_name: "Foreign Transaction Fee (travel tips page)"
    category: "credit_card_standard"
    # Matrix-only source, read directly by _enterprise_bank_consumer_row()
    # in credit_card_matrix.py -- not part of enterprise_bank_credit_cards'
    # products list above, since this isn't a per-card Schumer-box field,
    # it's a single prose statement on a different page entirely (see the
    # GUARDRAIL comment on _enterprise_bank_consumer_row for the full
    # reasoning and the 2019-benefits-PDF source this must never come
    # from instead). Confirmed 2026-08-04, under "During Your Trip" ->
    # "Currency Conversion": "If you have a Visa� credit card, each time
    # a transaction is made in a foreign currency or in a country outside
    # the United States and its territories, a foreign transaction fee of
    # 1 percent is assessed." Pattern anchored on the surrounding sentence
    # (tolerant of the (R) glyph and surrounding punctuation), with the
    # capture group wrapping the QUANTITY ITSELF (number + "percent"/"%"),
    # not just a bare digit -- so the captured text is a complete,
    # self-describing value ("1 percent") with no field_fixed_values
    # override needed. If Enterprise reprices to 2 percent or switches to
    # a numeral like "1%", this pattern still matches and reports the new
    # figure; if the sentence changes shape entirely, it stops matching
    # and falls back to NOT_PUBLICLY_DISCLOSED rather than silently
    # keeping a stale figure.
    field_patterns:
      foreign_transaction_fee: 'Visa.{0,3}credit card,[^.]*a foreign transaction fee of ([\d.]+\s*(?:percent|%)) is assessed'
